name: med_history
description: Застосунок для збереження історії хвороб
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  intl: ^0.19.0
  file_picker: ^10.3.8
  open_filex: ^4.4.0
dev_dependencies:
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
flutter_native_splash:
  color: "#00897B"
  image: assets/icon_fg.png
